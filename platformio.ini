
[env:pico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower

; 250 MHz: zapas dla dekodera SPI przy 40 MHz (np. LovyanGFX - wiele krotkich komend). Napiecie rdzenia
; 1,20 V podnosi main.cpp przed zmiana zegara; WiFi CYW43 arduino-pico samo zwalnia od 250 MHz (dzielnik 4).
board_build.f_cpu = 250000000L
; Partycja LittleFS na ustawienia (model LCD, obrot, skala, WiFi)
board_build.filesystem_size = 64k

upload_protocol = picotool

extra_scripts = pre:tools/pioasm.py

build_flags =
    -O2

monitor_speed = 115200
