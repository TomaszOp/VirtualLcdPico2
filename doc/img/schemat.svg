<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>VirtualLcd – how it works</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7fb"/><stop offset="1" stop-color="#eceff7"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="980" height="470" rx="18" fill="url(#bg)"/>

  <!-- ===== 1. Program zrodlowy ===== -->
  <g transform="translate(30 34)">
    <rect width="270" height="150" rx="10" fill="#1e1e2e"/>
    <circle cx="16" cy="14" r="4" fill="#f87171"/><circle cx="30" cy="14" r="4" fill="#fbbf24"/><circle cx="44" cy="14" r="4" fill="#34d399"/>
    <text x="258" y="18" font-size="11" fill="#94a3b8" text-anchor="end">main.cpp</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5">
      <text x="14" y="46" fill="#c084fc">#include <tspan fill="#a5f3fc">&lt;Adafruit_ILI9341.h&gt;</tspan></text>
      <text x="14" y="70" fill="#e2e8f0">tft.<tspan fill="#93c5fd">begin</tspan>();</text>
      <text x="14" y="90" fill="#e2e8f0">tft.<tspan fill="#93c5fd">fillScreen</tspan>(<tspan fill="#fca5a5">NAVY</tspan>);</text>
      <text x="14" y="110" fill="#e2e8f0">tft.<tspan fill="#93c5fd">print</tspan>(<tspan fill="#86efac">"Hello!"</tspan>);</text>
      <text x="14" y="134" fill="#64748b">// no code changes</text>
    </g>
  </g>
  <path d="M165 186 V214" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)"/>

  <!-- ===== 1. Mikrokontroler ===== -->
  <g transform="translate(70 222)">
    <rect width="190" height="120" rx="8" fill="#1f2937"/>
    <rect x="62" y="30" width="66" height="60" rx="4" fill="#111827" stroke="#374151"/>
    <text x="95" y="58" font-size="12" font-weight="700" fill="#e5e7eb" text-anchor="middle">ESP32</text>
    <text x="95" y="74" font-size="9.5" fill="#9ca3af" text-anchor="middle">RP2040 · STM32</text>
    <g fill="#d4a72c">
      <rect x="12" y="8" width="8" height="8" rx="1"/><rect x="28" y="8" width="8" height="8" rx="1"/><rect x="44" y="8" width="8" height="8" rx="1"/>
      <rect x="140" y="8" width="8" height="8" rx="1"/><rect x="156" y="8" width="8" height="8" rx="1"/><rect x="172" y="8" width="8" height="8" rx="1"/>
      <rect x="12" y="104" width="8" height="8" rx="1"/><rect x="28" y="104" width="8" height="8" rx="1"/><rect x="44" y="104" width="8" height="8" rx="1"/>
      <rect x="140" y="104" width="8" height="8" rx="1"/><rect x="156" y="104" width="8" height="8" rx="1"/><rect x="172" y="104" width="8" height="8" rx="1"/>
    </g>
    <rect x="-10" y="48" width="14" height="24" rx="3" fill="#9ca3af"/>
  </g>
  <text x="165" y="374" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Microcontroller</text>
  <text x="165" y="394" font-size="12.5" fill="#475569" text-anchor="middle">Your program and LCD library</text>
  <text x="165" y="411" font-size="12.5" fill="#475569" text-anchor="middle">(Adafruit_GFX, TFT_eSPI, LovyanGFX…)</text>

  <!-- ===== Przewody SPI ===== -->
  <g stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M260 240 C 320 240, 330 240, 390 240" stroke="#f59e0b"/>
    <path d="M260 258 C 320 258, 330 258, 390 258" stroke="#3b82f6"/>
    <path d="M260 276 C 320 276, 330 276, 390 276" stroke="#10b981"/>
    <path d="M260 294 C 320 294, 330 294, 390 294" stroke="#ef4444"/>
    <path d="M260 312 C 320 312, 330 312, 390 312" stroke="#8b5cf6"/>
  </g>
  <g font-size="10.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="325" y="235" fill="#b45309">SCK</text>
    <text x="325" y="253" fill="#1d4ed8">MOSI</text>
    <text x="325" y="271" fill="#047857">D/C</text>
    <text x="325" y="289" fill="#b91c1c">CS</text>
    <text x="325" y="307" fill="#6d28d9">RST</text>
  </g>
  <text x="325" y="208" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">SPI</text>
  <text x="325" y="336" font-size="11" fill="#64748b" text-anchor="middle">wires instead of the LCD</text>

  <!-- ===== 2. Pico 2 W ===== -->
  <g transform="translate(390 196)">
    <rect width="150" height="160" rx="8" fill="#15803d"/>
    <rect x="57" y="-12" width="36" height="18" rx="3" fill="#9ca3af"/>
    <rect x="42" y="48" width="66" height="66" rx="4" fill="#111827"/>
    <text x="75" y="78" font-size="12" font-weight="700" fill="#e5e7eb" text-anchor="middle">RP2350</text>
    <text x="75" y="94" font-size="9.5" fill="#9ca3af" text-anchor="middle">PIO + DMA</text>
    <rect x="96" y="14" width="40" height="26" rx="3" fill="#d1d5db"/>
    <text x="116" y="31" font-size="8.5" font-weight="700" fill="#374151" text-anchor="middle">WiFi</text>
    <g fill="#e5e7eb">
      <circle cx="10" cy="44" r="4"/><circle cx="10" cy="62" r="4"/><circle cx="10" cy="80" r="4"/><circle cx="10" cy="98" r="4"/><circle cx="10" cy="116" r="4"/><circle cx="10" cy="134" r="4"/>
      <circle cx="140" cy="62" r="4"/><circle cx="140" cy="80" r="4"/><circle cx="140" cy="98" r="4"/><circle cx="140" cy="116" r="4"/><circle cx="140" cy="134" r="4"/>
    </g>
  </g>
  <text x="465" y="384" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Raspberry Pi Pico 2 W</text>
  <text x="465" y="404" font-size="12.5" fill="#475569" text-anchor="middle">emulates the LCD controller</text>
  <text x="465" y="421" font-size="12.5" fill="#475569" text-anchor="middle">(ILI9341, ST7789, GC9A01, ST7735…)</text>

  <!-- ===== WiFi ===== -->
  <g fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round">
    <path d="M598 262 a22 22 0 0 1 0 32"/>
    <path d="M612 250 a38 38 0 0 1 0 56"/>
    <path d="M626 238 a54 54 0 0 1 0 80"/>
  </g>
  <circle cx="588" cy="278" r="5" fill="#2563eb"/>
  <path d="M640 278 H 690" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <text x="640" y="214" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">WiFi</text>
  <text x="640" y="346" font-size="11" fill="#64748b" text-anchor="middle">WebSocket</text>

  <!-- ===== 3. Telefon ===== -->
  <g transform="translate(704 40)">
    <rect width="190" height="360" rx="30" fill="#111827"/>
    <rect x="8" y="8" width="174" height="344" rx="23" fill="#f8fafc"/>
    <rect x="70" y="16" width="50" height="12" rx="6" fill="#111827"/>
    <!-- pasek strony -->
    <rect x="18" y="38" width="154" height="22" rx="8" fill="#e0e7ff"/>
    <rect x="24" y="44" width="14" height="10" rx="3" fill="#4f46e5"/>
    <text x="44" y="53" font-size="9.5" font-weight="700" fill="#1e293b">Virtual LCD</text>
    <text x="164" y="53" font-size="8.5" font-weight="700" fill="#4f46e5" text-anchor="end">PL | EN</text>
    <!-- tlo podgladu -->
    <rect x="18" y="68" width="154" height="236" rx="10" fill="#cbd0d9"/>
    <!-- ekran LCD -->
    <rect x="31" y="84" width="128" height="170" rx="3" fill="#05060a"/>
    <rect x="35" y="88" width="120" height="162" fill="url(#scr)"/>
    <text x="95" y="128" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">Hello!</text>
    <g>
      <rect x="45" y="146" width="14" height="40" fill="#ef4444"/><rect x="61" y="146" width="14" height="40" fill="#f59e0b"/>
      <rect x="77" y="146" width="14" height="40" fill="#facc15"/><rect x="93" y="146" width="14" height="40" fill="#22c55e"/>
      <rect x="109" y="146" width="14" height="40" fill="#3b82f6"/><rect x="125" y="146" width="20" height="40" fill="#a855f7"/>
    </g>
    <circle cx="95" cy="220" r="17" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M95 220 V209 M95 220 L103 224" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- stan -->
    <rect x="30" y="268" width="62" height="16" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="40" cy="276" r="3.5" fill="#10b981"/>
    <text x="47" y="279.5" font-size="8" fill="#475569">Connected</text>
    <rect x="97" y="268" width="62" height="16" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="128" y="279.5" font-size="8" fill="#475569" text-anchor="middle">ILI9341</text>
    <rect x="70" y="332" width="50" height="4" rx="2" fill="#94a3b8"/>
  </g>
  <text x="799" y="428" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Browser</text>
  <text x="799" y="448" font-size="12.5" fill="#475569" text-anchor="middle">phone or computer – live LCD image</text>
</svg>
